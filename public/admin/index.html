<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 测试服务器 - 管理控制台</title>
  
  <!-- Tailwind CSS -->
  <script src="tailwind.min.js"></script>
  
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  
  <!-- 主容器 -->
  <div id="app" class="flex h-screen overflow-hidden">
    
    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar">
      <!-- Logo 区域 -->
      <div class="sidebar-header">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span class="logo-text">API Server</span>
        </div>
      </div>
      
      <!-- 导航菜单 -->
      <nav class="sidebar-nav">
        <a href="#/" class="nav-item active" data-page="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          <span class="nav-text">概览</span>
        </a>
        
        <a href="#/modules" class="nav-item" data-page="modules">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          <span class="nav-text">模块管理</span>
        </a>
        
        <a href="#/data" class="nav-item" data-page="data">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
          </svg>
          <span class="nav-text">数据管理</span>
        </a>
        
        <a href="#/interfaces" class="nav-item" data-page="interfaces">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span class="nav-text">接口管理</span>
        </a>
        
        <a href="#/scenarios" class="nav-item" data-page="scenarios">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
          </svg>
          <span class="nav-text">场景管理</span>
        </a>
        
        <a href="#/test" class="nav-item" data-page="test">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="nav-text">接口测试</span>
        </a>
        
        <a href="#/help" class="nav-item" data-page="help">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="nav-text">使用说明</span>
        </a>
      </nav>
      
      <!-- 底部信息 -->
      <div class="sidebar-footer">
        <div class="footer-item">
          <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
          </svg>
          <span>v1.0.0</span>
        </div>
        <div class="footer-item">
          <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
          </svg>
          <span>Development</span>
        </div>
      </div>
    </aside>
    
    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶部栏 -->
      <header class="header">
        <div class="header-left">
          <div class="page-indicator"></div>
          <h1 id="page-title" class="page-title">概览</h1>
        </div>
        <div class="header-right">
          <button id="refresh-btn" class="icon-btn" title="刷新">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
          <div class="status-badge">
            <div class="status-dot"></div>
            <span>运行中</span>
          </div>
        </div>
      </header>
      
      <!-- 内容容器 -->
      <div id="content" class="content-area">
        <div class="loading-screen">
          <div class="spinner"></div>
          <p class="loading-text">加载中...</p>
        </div>
      </div>
    </main>
    
  </div>
  
  <!-- 模态框容器 -->
  <div id="modal-root"></div>
  
  <!-- Toast 容器 -->
  <div id="toast-container"></div>
  
  <!-- 加载脚本 - 按顺序加载 -->
  <!-- 1. 首先加载组件 -->
  <script src="components/toast.js"></script>
  <script src="components/modal.js"></script>
  <script src="components/table.js"></script>
  <script src="components/form.js"></script>
  
  <!-- 2. 然后加载页面组件 -->
  <script src="pages/dashboard.js"></script>
  <script src="pages/modules.js"></script>
  <script src="pages/data.js"></script>
  <script src="pages/data-detail.js"></script>
  <script src="pages/interfaces.js"></script>
  <script src="pages/scenarios.js"></script>
  <script src="pages/test.js"></script>
  <script src="pages/help.js"></script>
  
  <!-- 3. 最后加载主应用 -->
  <script src="app.js"></script>
  
  <!-- 4. 确保所有组件都已加载 -->
  <script>
    // 验证关键组件是否已加载
    if (typeof window.Table === 'undefined') {
      console.error('Table 组件未加载');
    }
    if (typeof window.toast === 'undefined') {
      console.error('Toast 组件未加载');
    }
    if (typeof window.modal === 'undefined') {
      console.error('Modal 组件未加载');
    }
    if (typeof window.Form === 'undefined') {
      console.error('Form 组件未加载');
    }
  </script>
</body>
</html>
